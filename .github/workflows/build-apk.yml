# Place this file at: .github/workflows/build-apk.yml
# Place warwatch-android.zip in the ROOT of the same repository.
name: Build WarWatch APK

on:
  push:
    branches: [main]
    paths:
      - "warwatch-android.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p build_src
          unzip -q warwatch-android.zip -d build_src
          PROJECT_DIR=build_src
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            FOUND=$(find build_src -maxdepth 3 -name settings.gradle.kts | head -n 1)
            PROJECT_DIR=$(dirname "$FOUND")
          fi
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" WarWatch.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarWatch-APK
          path: WarWatch.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WarWatch build ${{ github.run_number }}
          files: WarWatch.apk
